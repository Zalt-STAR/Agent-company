<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dodge</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="hud"><h1 id="title">Dodge</h1><span>⏱ <b id="time">0.0</b> / <b id="goal">30</b>s</span></header>
      <div class="stage">
        <canvas id="game" width="480" height="560"></canvas>
        <div id="overlay" class="overlay">
          <h2 id="overlay-title"></h2>
          <p id="overlay-text"></p>
          <button id="overlay-action">Play</button>
        </div>
      </div>
      <p class="hint">← → or A D to move · Enter to start</p>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
